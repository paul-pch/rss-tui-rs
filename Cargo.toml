[package]
name = "rss-tui-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.11"
feed-rs = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
ureq = "3.4.2"
url = "2.5.8"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
